<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unicode Fonts</title>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none}
body{display:grid;gap:1.5rem;max-width:72rem;margin:auto;padding:2rem 1.25rem;font:16px/1.6 system-ui,sans-serif;color:#17160f;background-color:#fbfaf7;background-image:repeating-linear-gradient(#edeadd 0 1px,transparent 1px 2rem),repeating-linear-gradient(90deg,#edeadd 0 1px,transparent 1px 2rem);color-scheme:light}
em{font:600 1.5rem/1.2 Georgia,serif;letter-spacing:-.02rem}
header p,label,small{color:#8b877c}
header p{margin-top:.35rem;font-size:.9rem}
main{display:grid;gap:.75rem}
label{font-size:.7rem;letter-spacing:.1rem;text-transform:uppercase}
button,input,textarea{font:inherit;color:inherit;border:1px solid #e5e2d9;border-radius:.5rem;background:#fff}
textarea{width:100%;min-height:4.5rem;padding:.6rem .75rem;font-size:1rem;line-height:1.5;resize:vertical}
input{padding:.45rem .75rem;font-size:.9rem}
ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.5rem;list-style:none}
li{display:grid;grid-template-rows:auto 1fr auto;gap:.5rem;padding:.6rem;background:#fff;border:1px solid #e5e2d9;border-radius:.5rem}
li[data-pinned]{border-color:#d9cba9;background:#fdf8ec;animation:pin .55s ease-out}
small{font:.7rem/1.4 ui-monospace,monospace;overflow-wrap:anywhere}
code{font:.82rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f1efe7;color:#635b45;padding:.1rem .2rem;border:1px solid #e5e2d9;border-radius:.2rem}
bdi{font-size:1.15rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;align-self:start}
li>header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;cursor:pointer}
li>header>button{flex:none;padding:.15rem .25rem;border:0;background:none;font-size:.9rem;line-height:1;color:#8b877c}
@keyframes pin{20%{rotate:-1.1deg}45%{rotate:.7deg}70%{rotate:-.3deg}100%{rotate:0deg}}
li>header>button[aria-pressed="true"]{color:#8f6f1c}
button{padding:.3rem .9rem;font-size:.8rem}
button:hover{border-color:#cfcab8;color:#17160f}
button:active{background:#e9e5d6}
button[data-copied]{background:#17160f;border-color:#17160f;color:#fbfaf7}
a{color:inherit;text-decoration-color:#cfcab8;text-underline-offset:.25rem}
a:hover{text-decoration-color:#17160f}
:focus-visible{outline:2px solid #17160f}
:is(button,input,textarea):focus-visible{outline:none;border-color:#17160f;box-shadow:inset 0 0 0 1px #17160f}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<header>
<h1><em>Unicode Fonts</em></h1>
<p>Type or paste text and every style updates automatically. <code>Copy</code> puts a style on your clipboard, and the <code>star</code> pins it to the top. <a href="https://github.com/dazzywi/unicode-fonts">GitHub</a></p>
</header>
<main>

const sub=(set,text)=>{
  const glyph=[...set];
  return [...text].map((c)=>{const i=CHARS.indexOf(c);return i<0?CHARS[glyph.indexOf(c)]??c:glyph[i]}).join("");
};
const draw=(style,text)=>(typeof style==="function"?style(text):sub(style,text));
const box=document.getElementById("text"),search=document.getElementById("search"),list=document.getElementById("styles"),template=document.getElementById("row");
const byId=new Map();
let pins=[],timer=0,shown="";
const rows=Object.entries(STYLES).map(([name,style])=>{
  const li=template.content.firstElementChild.cloneNode(true);
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const row={id,name,style,li,out:li.querySelector("bdi"),pin:li.querySelector("[aria-pressed]"),copy:li.querySelector(":scope>button")};
  li.querySelector("small").textContent=name;
  row.pin.setAttribute("aria-label",`Pin ${name}`);
  row.pin.parentElement.addEventListener("click",()=>toggle(row));
  row.copy.addEventListener("click",()=>copyText(row.out.textContent,row.copy));
  byId.set(id,row);
  return row;
});
const paint=(row,on)=>{
  row.pin.setAttribute("aria-pressed",on);
  row.pin.textContent=on?"★":"☆";
  row.li.toggleAttribute("data-pinned",on);
};
const arrange=()=>list.replaceChildren(...pins.map((id)=>byId.get(id).li),...rows.filter((row)=>!pins.includes(row.id)).map((row)=>row.li));
const update=()=>{
  const q=search.value.trim().toLowerCase(),text=box.value;
  const redraw=text!==shown;shown=text;
  for (const row of rows){
    if(redraw)row.out.textContent=draw(row.style,text);
    row.li.hidden=q&&!row.name.toLowerCase().includes(q);
 }
};
const sync=()=>{
  clearTimeout(timer);
  const params=new URLSearchParams(),text=box.value,q=search.value.trim();
  if(text)params.set("t",text);
  if(pins.length)params.set("p",pins.join(","));
  if(q)params.set("q",q);
  const query=params.toString().replace(/%2C/g,",");
  history.replaceState(null,"",query?`?${query}`:location.pathname);
};
const toggle=(row)=>{
  const at=pins.indexOf(row.id);
  if (at<0) pins.unshift(row.id);else pins.splice(at,1);
  paint(row,at<0);arrange();sync();
};
const copyText=(text,button)=>{
  clearTimeout(button.timer);
  navigator.clipboard?.writeText(text).then(()=>{
    button.dataset.copied="";
    button.timer=setTimeout(()=>delete button.dataset.copied,600);
 },()=>{});
};
const read=()=>{
  const params=new URLSearchParams(location.search);
  box.value=params.get("t")??box.defaultValue;
  pins=[...new Set((params.get("p")??"").split(",").map((id)=>id.trim()))].filter((id)=>byId.has(id));
  pins.forEach((id)=>paint(byId.get(id),true));
  search.value=params.get("q")??"";
  arrange();
};
const queue=()=>{clearTimeout(timer);timer=setTimeout(sync,250);};
[box,search].forEach((input)=>input.addEventListener("input",()=>{update();queue();}));
read();update();
</script>
